name: Reproduce text classification

on: [push, pull_request, workflow_dispatch]

jobs:
  reproduce:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.22'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce the fixed experiment from raw CSV
        run: python main.py --output-dir outputs/ci
      - name: Independently verify saved predictions and parameters
        run: python verify_reproduction.py outputs/ci
      - name: Preserve reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-results
          path: outputs/ci
